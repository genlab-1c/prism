# SMOP — ПРОТОКОЛ УРОВНЯ 1 (авто-оценка оракулами):
# «КАК машина вообще выводит балл».
#
# Балл каждой оси — из ОДНОЙ таблицы scoring.table (единственный источник правды:
# и человеку, и скореру). Строки проверяются сверху вниз, берётся первый подходящий;
# направление сравнения задаёт scoring.direction:
#   lower_is_better   — bound = «не больше N» (≤); меньше сигнала → выше балл  (S, O, P)
#   higher_is_better  — bound = «не меньше N» (≥); больше сигнала → выше балл  (M)
#   exclusive: true   — строгое сравнение (< / >)
#   else: true        — хвостовая строка «во всех прочих случаях»
# Достижимые баллы оси = множество score её таблицы, суженное ограничителями оси:
#   pre_check  — балл (или N/A) минуя таблицу;
#   ceiling    — потолок при невыполненном условии оси (S: модуль не собирается).
# Из-за них часть ступеней недостижима, и это записано у каждой оси в reachable_note.
# Значения совпадают по шкале с L2 (metrics/smop_l2_expert.yaml), иначе κ auto↔expert неизмеримо.
# ВАЖНО: совпадать должна не только шкала, но и СМЫСЛ ступени. Ось S в версии 1.5.0 —
# живой пример: рубрика L2 читала ступени как «сколько правок до компиляции» и отдавала 8
# несобравшемуся модулю, а L1 после потолка даёт ему 6. Разошлись бы систематически на
# ступень, поэтому рубрику L2 переписали под ту же границу «собирается / не собирается».
#
# Гейтинг: нет инструмента оси (поле instrument) → ось НЕ измерена для прогона и
# исключается из Q как N/A — НЕ ставится 0.

protocol:
  level: 1
  name: auto
  constitution: metrics/smop.yaml

axes:

  S:
    measures: компилируется ли модуль
    instrument:
      A: OneScript — вердикт «собирается ли»; BSL Language Server — тяжесть, число причин
      B: компилятор 1С (DESIGNER /CheckModules -Server) — ошибки только модуля кандидата
    signal:
      count: корневые причины = кластеры ParseError + compile-блокеры
      cluster_rule: соседние ParseError в пределах cluster_gap строк считаются одной причиной
    excludes:
      - предупреждения и стандарты (DeprecatedCurrentDate и т.п.) → ось O
    pre_check:                          # минует таблицу, отдаёт 0 напрямую
      rule: дисбаланс парности (Функция/КонецФункции, Если, Цикл, Попытка) → S=0
      why: ловит обрезанную генерацию, которую парсер молча пропускает
    compile_check:                      # вердикт «собирается ли» и потолок для несобравшегося
      # Вердикт добывается по-разному: кат. A — у движка, который код ИСПОЛНЯЕТ (OneScript,
      # потому что BSL LS парсер и снисходителен); кат. B — прямо у компилятора платформы
      # (1С /CheckModules), там он точный. Потолок (ceiling) общий для обеих категорий.
      why: |
        BSL LS — парсер, а не компилятор, и он снисходителен: на корпусе 173 записи из 780
        не собираются в OneScript, причём 66 из них имели S=8 или 10, то есть ось УТВЕРЖДАЛА
        «компилируется без ошибок» про код, который заведомо не компилируется. Поэтому вердикт
        «собирается» берём у OneScript (он же исполняет тесты оси M — один артефакт, один
        движок, два сигнала, как в категории B), а ЧИСЛО причин по-прежнему считает BSL LS.
      rule: не разобрался → число корневых причин не меньше 1 (точного счёта движок не даёт)
      ceiling: 6                        # не собрался → выше 6 балл не поднимается
      ceiling_why: |
        Баллы выше 6 УТВЕРЖДАЮТ, что модуль собирается. Раньше модуль с одной корневой
        причиной получал 8 из 10, хотя не компилировался вовсе, и эта восьмёрка тянула
        вверх итог Q: несобравшийся модуль (S=8, M=0, остальное не измерено) давал Q=4.0
        против 3.33 у модуля, который собрался, дошёл до базы и наврал в метаданных.
        Пока ось P ставила ноль всему, что не дошло до базы, перекос был не виден — ноль
        по P его гасил. Снятие того нуля (протокол 1.5.0) вытащило перекос наружу.
        Проверено на корпусе: в категории A вердикт и число причин совпадают полностью —
        все 663 собравшихся модуля имеют ровно 0 причин, все 117 несобравшихся минимум 1.
        То есть ступень 8 сегодня в 100% случаев означает «не компилируется», а вовсе не
        «компилируется с замечанием», и столкновения смыслов на ступени 6 не возникает.
      clean_marker: "No errors."
      not_syntax:                       # НЕ синтаксис: по конституции несуществующие имена вне S
        - "Symbol not found"
        - "Method not found"
        - "Type is not defined"
        - "Variable not found"
    scoring:
      unit: корневые причины
      direction: lower_is_better
      reachable_note: >
        С потолком (compile_check.ceiling) достижимы {0, 2, 4, 6, 10}: ступень 8 остаётся
        только собравшемуся модулю, к которому придрался анализатор, а на корпусе таких нет
        вовсе — все 663 собравшихся имеют ровно 0 причин. Границу «собирается / не собирается»
        шкала проводит между 8 и 6, и рубрика L2 проведена по тому же месту. Несобравшийся
        модуль получает: 1–3 причины → 6, 4–6 → 4, больше шести → 2, разрушенная структура → 0.
      table:
        - { bound: 0, score: 10 }       # без ошибок
        - { bound: 1, score: 8 }        # одна причина
        - { bound: 3, score: 6 }        # 2–3
        - { bound: 6, score: 4 }        # 4–6
        - { else: true, score: 2 }      # больше 6
    cluster_gap: 3
    compile_blocker_codes: [ProcedureReturnsValue]   # не-ParseError диагностики «не скомпилируется»

  M:
    measures: соответствие логики требованиям — исполнением скрытых тестов
    instrument:
      A: OneScript 2.0
      B: 1С против синтетической базы задачи (harness/execute/onec; формат проверок — родной, миграция на YAXUNIT — план)
    signal:
      share: доля прошедших тестов passed/total
      floor: не скомпилировался / не исполнился → 0 (нет подтверждённого смысла)
    cpu_limit_s: 15                     # бюджет ПРОЦЕССОРНОГО времени на прогон тестов
    why_cpu: |
      Лимит меряется процессорным временем, а не настенным: настенное зависит от того, чем ещё
      занята машина, и балл начинал зависеть от очереди (наблюдалось дважды на одной записи).
      Исчерпал бюджет — вина кандидата (M=0). Сторож по настенным часам остаётся, но с большим
      запасом и означает «не измерено», а не «медленно»: это сбой окружения, не свойство кода.
    scoring:
      unit: доля прошедших тестов
      direction: higher_is_better
      leaderboard: плавная оценка = доля × 10 (хранимая, лидербордная); таблица ниже —
        проекция этой доли в 6 ступенек ТОЛЬКО для сверки с экспертом (κ). Так уходит
        мёртвая зона — 4/5=80% даёт на лидерборде 8.0, а в сверке проецируется в ступеньку 6.
      table:
        - { bound: 1.00, score: 10 }                  # 100%
        - { bound: 0.85, score: 8 }                   # ≥ 85%
        - { bound: 0.60, score: 6 }                   # ≥ 60%
        - { bound: 0.50, score: 4 }                   # ≥ 50%
        - { bound: 0.0, exclusive: true, score: 2 }   # > 0%
        - { else: true, score: 0 }                    # 0% или не исполнился

  O:
    measures: оптимальность решения — исполнением (O-исп, есть perf.yaml) или статикой (O-авто, откат)
    coverage: |
      O-исп — класс роста ИСПОЛНЕНИЕМ: A — число операций на растущем входе (codestat,
      exec_scoring, harness/score/optimization_exec.py); B — цена работы с СУБД на растущей базе
      (техжурнал 1С, b_exec_scoring, harness/score/optimization_b_exec.py + execute/onec/perf_run.py):
      либо число обращений, либо число поднятых строк — что из двух, задаёт perf.count.
      O-авто — perf/арх-антипаттерны статикой (white_list): откат для задач без perf.yaml.
      O-арх (неалгоритмическая архитектура) остаётся на Уровень 2.
      Балл оси по задаче: есть perf.yaml → ТОЛЬКО O-исп; если код не исполняется, O = N/A
      (НЕ откат на статический O-авто: он мерит вид кода в отрыве от исполнения — выдавал бы
      высокий балл неисполнимому коду; в кат. B наблюдали O-авто=10 при M=0). Без perf → O-авто,
      но ТОЛЬКО для исполнившегося кода (гейт по исполнению orchestrate._score_optimization):
      не скомпилировался / не запустился → N/A. N/A исключается из Q, как ось P для A. ОГОВОРКА κ: эксперт оценивает O холистически
      (асимптотика + структура + стиль), а O-исп — только класс роста; согласие L1↔L2 по O
      считать с этой поправкой.
    instrument: BSL LS (O-авто, white_list) · OneScript -codestat (O-исп A) · техжурнал 1С (O-исп B)
    correctness_gate:                   # оптимальность НЕрешённой задачи бессмысленна
      m_below: 5.0                      # M ниже порога → O = N/A, а не высокий балл
      why: >
        «Эффективно, но неверно» не должно попадать в верх шкалы: быстрее всего работает
        код, который не решает задачу. Порог жил константой в harness/orchestrate.py вопреки
        принципу репозитория «пороги в YAML, код их читает»; вынесен сюда в протоколе 1.5.0.
    signal:
      weight: взвешенная сумма сработавших диагностик из white_list
      excludes: стилевой шум (MagicNumber, LineLength) — сознательно вне S и O (антикоррелировал с экспертом)
    white_list:                         # код диагностики BSL LS → вес вклада
      CreateQueryInCycle: 2.0           # запрос в цикле — заглавный антипаттерн O-авто (конституция, L2 балл 4)
      VirtualTableCallWithoutParameters: 2.0
      JoinWithVirtualTable: 2.0
      JoinWithSubQuery: 1.5
      QueryNestedFieldsByDot: 1.0
      DeprecatedCurrentDate: 1.0
      SelectTopWithoutOrderBy: 1.0
      LogicalOrInTheWhereSectionOfQuery: 1.0   # ИЛИ в ГДЕ — неиндексируемо (встречается в генерациях B)
      RefOveruse: 1.0                          # лишнее обращение .Ссылка → неявное соединение на строку
      # QueryToMissingMetadata выведена: несуществующие метаданные — конструкт оси P
      # (конституция, excludes S), с переводом P на исполнение был бы двойной штраф
    scoring:
      unit: суммарный вес антипаттернов
      direction: lower_is_better
      floor_note: машина не опускает O ниже 2 — считает лишь ограниченный список (честный предел инструмента)
      reachable_note: достижимые ступени L1 = {2,4,6,8,10} — без 0 и почти без 2 (для O=2 нужен
        вес >6, т.е. ≥4 тяжёлых хита). L2 же активно ставит 0 и 2 («критические проблемы»,
        «множественные антипаттерны»). Поэтому нижние ступени L1↔L2 несопоставимы напрямую —
        κ по O считать с учётом усечённой проекции (как взвешенную по P, см. validity.md)
      table:
        - { bound: 0, score: 10 }       # чисто
        - { bound: 1, score: 8 }        # ≤ 1
        - { bound: 3, score: 6 }        # ≤ 3
        - { bound: 6, score: 4 }        # ≤ 6
        - { else: true, score: 2 }      # > 6
    exec_scoring:                       # O-ИСПОЛНЕНИЕ (категория A): алгоритмическая оптимальность
      what: |
        Статика в алгоритмике A антипаттернов не видит (O-авто упирается в 10). Поэтому для A
        оптимальность мерится ИСПОЛНЕНИЕМ: решение гоняется на лесенке размеров входа (perf.yaml),
        число операций берётся из oscript -codestat, показатель роста p сравнивается с оптимальным
        для задачи p_opt. Стоимость встроенных команд (Найти, склейка строк) учитывается подменой
        на инструментированные аналоги. Сигнал = отклонение d = p − p_opt (меньше → лучше).
      direction: lower_is_better        # меньше отклонение роста от оптимума → выше балл
      cpu_limit_s: 60                   # бюджет ПРОЦЕССОРНОГО времени на ОДИН размер входа
      why_cpu: |
        Тот же довод, что у оси M: вердикт «слишком медленно» должен быть свойством кода, а не
        загрузки машины. Замер самой тяжёлой записи корпуса требует ~36 процессорных секунд,
        то есть у лимита полуторный запас. Исчерпание бюджета — балл 2 («катастрофически
        хуже»); срабатывание настенного сторожа — ось НЕ измерена.
      table:
        - { bound: 0.2, score: 10 }     # на уровне оптимального класса
        - { bound: 0.5, score: 8 }      # чуть хуже
        - { bound: 0.8, score: 6 }      # заметно хуже
        - { bound: 1.2, score: 4 }      # на класс хуже (напр. n vs n²)
        - { else: true, score: 2 }      # катастрофически хуже / таймаут
    b_exec_scoring:                     # O-ИСПОЛНЕНИЕ (категория B): цена работы с СУБД
      what: |
        Близнец exec_scoring для платформенных задач. Единица работы — не шаг кода, а работа с СУБД;
        вход растёт как БАЗА (perf.sizes = размер синтетической базы). Кандидат гоняется на лесенке
        размеров базы, счётчик берётся из техжурнала 1С по кадру стека кандидата
        (harness/execute/onec/perf_run.py) и даёт показатель роста p. Сигнал = отклонение d = p − p_opt.

        ЧТО именно растёт, задаёт perf.count — два семейства, ловят РАЗНЫЕ пороки:
          • число ОБРАЩЕНИЙ (sdbl | register) — порок «N+1»: запрос или чтение реквизита через
            точку в цикле. Решение набором → обращения плоские, p≈0; запрос в цикле → p≈1.
          • число поднятых СТРОК (rows | reg_rows) — порок «подними всё и разберись в коде»:
            походов столько же, а объём растёт. Пример: сложение внутри запроса возвращает одну
            строку при любой базе, выборка строк с суммированием в BSL — по строке на элемент.
        Строчные метрики применимы, ТОЛЬКО когда у правильного решения ответ ограничен: если
        perf.grow доращивает базу внутрь запрашиваемого множества, результат эталона растёт сам,
        и рост строк — свойство задачи, а не порок. Гейт двух якорей (эталон O≥8 и корректный,
        но медленный perf_baseline.bsl O≤4) машинно доказывает, что профиль задачи это соблюдает.

        ЧЕГО ОБЕ МЕТРИКИ НЕ ВИДЯТ: «виртуальная таблица без параметров». SQL у неё честно другой
        (платформа антипаттерн не переписывает: у оптимального решения отбор стоит внутри подзапроса
        к таблице итогов, у порочного подзапрос читает её целиком, а фильтр наложен снаружи), но
        лишняя работа — внутренний скан, а журнал сообщает лишь строки, ВОЗВРАЩЁННЫЕ оператором.
        Этот порок остаётся за O-авто (white_list, VirtualTableCallWithoutParameters).
      direction: lower_is_better
      anchor_max: 4                     # якорь (perf_baseline.bsl) обязан упасть НЕ ВЫШЕ этого
      table:
        - { bound: 0.2, score: 10 }     # обращения плоские при росте базы — набором (оптимум)
        - { bound: 0.5, score: 8 }      # слегка растут
        - { bound: 0.8, score: 6 }      # заметно растут
        - { bound: 1.2, score: 4 }      # линейно растут с базой — запрос в цикле
        - { else: true, score: 2 }      # хуже линейного (таймаут для B → N/A, не 2: замер не состоялся)
    b_rows_scoring:                     # O-ИСПОЛНЕНИЕ (категория B), счётчик СТРОК (perf.count: rows|reg_rows)
      what: |
        Отдельная шкала, потому что рост СТРОК и рост ОБРАЩЕНИЙ — пороки разной цены, и мерить их
        одной линейкой нечестно. «Запрос в цикле» — это N походов в СУБД, каждый со своим разбором,
        планом, блокировками и задержкой. «Подними строки и сложи в коде» — это ОДИН поход, но
        лишние строки материализуются и едут на сервер приложений. Число обращений при этом
        одинаковое, СУБД трогает те же строки; разница — в объёме, который пересекает границу,
        и в памяти. Цена реальная и растёт с данными, но на порядок ниже, чем у N походов.
        Поэтому линейный рост строк — это «заметно растут» (6), а не «запрос в цикле» (4);
        ниже шестёрки опускает только рост быстрее линейного.
        Шкала применима, лишь когда у правильного решения ответ ОГРАНИЧЕН: если задача обязана
        вернуть N строк, рост объёма — свойство задачи, а не порок (см. b_exec_scoring).
      direction: lower_is_better
      anchor_max: 6                     # предел этой шкалы для порока — им и гейтится якорь
      table:
        - { bound: 0.2, score: 10 }     # объём чтения плоский при росте базы — агрегат в запросе
        - { bound: 0.8, score: 8 }      # растёт медленнее линейного
        - { bound: 1.2, score: 6 }      # линейно: строка на элемент поднимается в память
        - { else: true, score: 4 }      # хуже линейного — объём растёт быстрее самой базы

  P:
    applies_to: [B]                     # для категории A = N/A (см. конституцию)
    measures: корректность обращений к объектам метаданных — исполнением против синтетической базы
    instrument: тот же прогон 1С, что и ось M (harness/execute/onec) — один запуск, два сигнала
    signal:
      share: доля тестов, исполнившихся БЕЗ платформенной ошибки (clean/judged)
      db_access: >
        Обращение к данным подтверждается ТЕХЖУРНАЛОМ того же сеанса: событие SDBL, в
        Context которого есть кадр «КодКандидата.Модуль». Ни одного такого события и ни
        одного провала по метаданным → ось не измерена, сколько бы тестов ни упало.
        Зачем. Лог тестов не говорит, дошёл ли код до базы: «Слишком много фактических
        параметров» и «Тип не определен (ПустоеЗначение)» выглядят обычным провалом, но
        случаются раньше первого запроса. Такие тесты считались чистыми, и 36 записей
        корпуса получали P=10 при ПОЛНОСТЬЮ провалившихся тестах. Ноль тут тоже неверен:
        обращений не было, значит и неверными они быть не могли.
        Техжурнала нет (сеанс не стартовал, старая запись кэша) — это «не знаем», и
        правило не применяется: спутать его с «обращений не было» значит объявить
        непроверенным всё, что просто не записалось.
      judged: >
        Знаменатель — только тесты, ДАВШИЕ свидетельство о метаданных. Платформа
        компилирует текст запроса по шагам: сначала грамматика, потом разрешение имён
        таблиц и полей. Тест, чей запрос не разобрался грамматически, до имён не дошёл и
        не говорит о знании метаданных ничего: он не «чистый» и не «провал», его просто
        нет в доле. Иначе вынос ошибок языка запросов из P (протокол 1.5.0) заменил бы
        одну неправду другой — такой тест попал бы в ЧИСЛИТЕЛЬ, и 6 записей корпуса
        получили бы P=10 «все обращения к метаданным отработали» ни за что.
        Не осталось ни одного проверенного теста → ось не измерена.
        Какие классы не доходят до имён, задаёт metadata_reached в error_taxonomy.yaml.
      markers: классификатор платформенных ошибок — platform_error_markers из
        metrics/error_taxonomy.yaml (раннер их читает, не хранит)
        («Поле не найдено», «Объект не найден», ошибки исполнения запроса и т.п.)
      boundary: неверный ОТВЕТ (FAIL по значению) платформенной ошибкой не считается —
        это ось M; P ловит только «упал на обращении к метаданным»
    history: статическая сверка со срезом схемы (v0) выведена из L1 — анти-валидна
      (ρ=−0.27 с экспертом, см. docs/validity.md); исполнение — её замена
    pre_check:                          # минует таблицу, отдаёт «не измерено»
      rule: функции кандидата нет / модуль не компилируется → P = N/A
      why: >
        Молчание канала — отсутствие свидетельства, а не свидетельство против. Модуль
        с одной опечаткой мог ссылаться на метаданные безупречно, и ноль утверждал бы
        обратное без оснований. Вина кандидата наказана там, где она измерена: S за
        несобираемость, M за непройденные тесты. Неполнота видна в охвате осей рядом с Q.
      history: >
        До протокола 1.5.0 здесь стоял P=0 «ни одного подтверждённого обращения к
        метаданным». Ноль держался заплаткой на формуле Q (среднее по измеренным осям
        поднимается при выпадении оси); заплатка снята вместе с вводом охвата.
    scoring:
      unit: доля тестов без платформенных ошибок
      direction: higher_is_better
      leaderboard: плавная оценка = чистая доля × 10 (хранимая, лидербордная); таблица —
        проекция в ступеньки только для сверки с экспертом
      reachable_note: ступеньки проекции достижимы {0,4,6,10} — без 2 и 8; единица L1 — тест,
        единица L2 — обращение к объекту, поэтому κ по P считать взвешенной (см. validity.md).
        На лидерборде P плавная, эта дискретность касается только сверки
      table:
        - { bound: 1.00, score: 10 }                  # все обращения к метаданным отработали
        - { bound: 0.50, score: 6 }                   # большинство обращений верны
        - { bound: 0.0, exclusive: true, score: 4 }   # хоть один тест пережил контакт с базой
        - { else: true, score: 0 }                    # ни одного: структура обращений вымышлена

meta:
  version: "1.5.0"          # 1.5.0: S — потолок 6 для модуля, который не собирается (баллы выше
                            #        утверждали бы, что он компилируется);
                            #        P — «не измерено» вместо нуля, когда прогон не дал ни одного
                            #        свидетельства об обращениях к метаданным; рядом с Q всегда
                            #        охват осей (измерено k из n), потому что среднее по измеренным
                            #        несравнимо между записями разной полноты;
                            #        классификатор платформенных ошибок знает виртуальные таблицы
                            #        и менеджеры объектов, а не один метод исполнения запроса
                            # 1.4.0: лимиты осей M и O — по ПРОЦЕССОРНОМУ времени (cpu_limit_s):
                            #        балл перестал зависеть от загрузки машины;
                            #        S кат. A — вердикт «собирается» от OneScript (compile_check),
                            #        BSL LS остаётся мерой тяжести; имена вне S (конституция)
                            # 1.3.0: O кат. B — счётчик строк (b_rows_scoring, своя шкала) и
                            #        порог anchor_max для гейта двух якорей
                            # 1.2.0: O — b_exec_scoring, исполнительная нога для B (техжурнал 1С)
                            # 1.1.0: P — исполнение против синтетической базы (вместо статики);
                            #        O — QueryToMissingMetadata выведена (конструкт P)
  description: Протокол автоматической оценки SMOP (Уровень 1)
  author: Андреев Д.С.
