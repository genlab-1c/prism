# Справочник типов ошибок генерации — для воронки отказа (prism leaderboard --full).
#
# Воронка не считает баллы. Она классифицирует, ГДЕ и КАК умирает прогон:
#   разбор → запуск → верно (см. harness/stats/funnel.py).
# Здесь — словарь «текст ошибки → код», чтобы назвать причину смерти человеческим
# словом. Данные не в коде: правила тут, классификатор их читает.
#
# Как работает: причина смерти берётся из detail.* прогона (сырые сообщения 1С/
# OneScript), и первое правило с совпавшим `match`-фрагментом (подстрока, регистр
# важен) даёт код. Порядок важен — частное выше общего. Не совпало ни одно правило —
# корзина `default_*` ниже (видимая, не молчаливая): пухнет — пополнить словарь.
#
# Платформенные ошибки (кат. B) ловятся не текстом, а структурой
# (detail.M.platform_errors) — для них код P.METADATA проставляется в коде воронки.

version: "0.2.0"   # 0.2.0: маркеры платформенной ошибки переехали сюда из кода раннера
                   # 0.1.1: подклассы маркера «(Выполнить)» для аудита корпуса (platform_subclasses)

# Маркеры платформенной ошибки в логе теста — СИГНАЛ ОСИ P (в отличие от просто неверного
# ответа, это ось M). Жили в harness/execute/onec/runner.py константой; список был закрыт
# и знал ровно один метод исполнения запроса, поэтому обращения к виртуальным таблицам
# регистров и запись в поле, доступное только на чтение, проходили мимо: 35 записей корпуса
# получали P=10 «все обращения к метаданным отработали» при том, что все тесты падали
# именно на платформе. Совпадение — подстрока, регистр не важен.
platform_error_markers:
  # — имя объекта или поля не разрешилось —
  - "Поле не найдено"
  - "Таблица не найдена"
  - "Объект не найден"
  - "не обнаружено"                  # «Поле объекта не обнаружено»
  - "Метод объекта не обнаружен"
  # — поле метаданных существует, но использовано не по назначению —
  # ОГОВОРКА: текст сам по себе не диагностичен, тот же он будет при записи в любое
  # read-only свойство глобального контекста. В корпусе все 6 случаев — «(ВидСчета)»
  # на B19: модель присваивает в занятое имя системного перечисления плана счетов,
  # то есть не знает предметной модели. Уточнять — по имени в скобках, когда у
  # классификатора появится вход в виде исходника кандидата, а не только лога.
  - "Поле объекта недоступно для записи"
  # — исполнение текста запроса —
  - "Ошибка при вызове метода контекста (Выполнить)"
  - "Ошибка при вызове метода контекста (ВыполнитьПакет)"
  - "Ошибка при вызове метода контекста (ВыполнитьПакетСПромежуточнымиДанными)"
  # — виртуальные таблицы регистров: имена методов менеджера однозначны, у обычных
  #   коллекций BSL таких методов нет, поэтому ложных срабатываний не будет —
  - "Ошибка при вызове метода контекста (Остатки)"
  - "Ошибка при вызове метода контекста (Обороты)"
  - "Ошибка при вызове метода контекста (ОстаткиИОбороты)"
  - "Ошибка при вызове метода контекста (СрезПоследних)"
  - "Ошибка при вызове метода контекста (СрезПервых)"
  - "Ошибка при вызове метода контекста (ОборотыДтКт)"
  - "Ошибка при вызове метода контекста (ДвиженияССубконто)"
  - "Ошибка при вызове метода контекста (ДвиженияСубконто)"
  - "Ошибка при вызове метода контекста (ПолучитьПоследнее)"
  - "Ошибка при вызове метода контекста (ПолучитьПервое)"
  - "Ошибка при вызове метода контекста (СоздатьНаборЗаписей)"
  - "Ошибка при вызове метода контекста (СоздатьМенеджерЗаписи)"
  - "Ошибка при вызове метода контекста (ВыбратьПоРегистратору)"
  - "Ошибка при вызове метода контекста (ДанныеГрафика)"
  - "Ошибка при вызове метода контекста (ФактическийПериодДействия)"
  # — менеджеры справочников, документов, планов счетов и ПВХ: те же соображения,
  #   у коллекций BSL таких методов нет —
  - "Ошибка при вызове метода контекста (ВыбратьИерархически)"
  - "Ошибка при вызове метода контекста (НайтиПоКоду)"
  - "Ошибка при вызове метода контекста (НайтиПоНаименованию)"
  - "Ошибка при вызове метода контекста (НайтиПоРеквизиту)"
  - "Ошибка при вызове метода контекста (НайтиПоНомеру)"
  - "Ошибка при вызове метода контекста (НайтиПоИдентификатору)"
  - "Ошибка при вызове метода контекста (СоздатьЭлемент)"
  - "Ошибка при вызове метода контекста (СоздатьГруппу)"
  - "Ошибка при вызове метода контекста (СоздатьДокумент)"
  - "Ошибка при вызове метода контекста (СоздатьСчет)"
  - "Ошибка при вызове метода контекста (СоздатьУзел)"
  - "Ошибка при вызове метода контекста (ПолучитьОбъект)"
  # НЕ брать в маркеры: Выбрать, Получить, Добавить, Найти, Записать, Прочитать,
  # Установить, Выгрузить, Загрузить, Сортировать, Свернуть. Эти имена есть и у обычных
  # коллекций (ТаблицаЗначений, Соответствие, выборка запроса), и ошибка под ними чаще
  # про общий BSL, то есть про ось M. Разобрано bsl-expert по коду кандидатов 2026-09-18:
  # из семи таких случаев корпуса четыре оказались платформенными, три — нет, и отличить
  # их по тексту исключения нельзя, нужен исходник.

# Правила классификации по фрагменту текста. axis — к какой оси SMOP тяготеет
# причина (для будущей тепловой карты); label — что печатать в колонке «причина».
rules:
  # — синтаксис / компиляция —
  - code: S.COMPILE
    axis: S
    label: "ошибка синтаксиса"
    match: ["Пропущен символ", "Ожидается символ", "Неопознанный оператор",
            "Identifier expecting", "Expecting symbol", "Unexpected"]

  # — точка входа —
  - code: M.NOENTRY
    axis: M
    label: "нужной функции нет"
    match: ["не найдено ни одной фун", "no entry", "точка входа"]

  # — типы (молчаливо неверный путь: код позвал не то / не так) —
  - code: M.TYPE
    axis: M
    label: "перепутаны типы данных"
    match: ["Несоответствие типов", "Conversion to type", "Invalid type of argument",
            "Value is not of object type", "is not writable", "Преобразование к типу"]

  # — обращение к несуществующему методу/типу —
  - code: M.NOMETHOD
    axis: M
    label: "вызов несуществующего метода"
    match: ["Method not found", "Метод объекта не обнаружен", "Метод не найден"]
  - code: M.NOTYPE
    axis: M
    label: "обращение к несуществующему типу"
    match: ["Type is not defined", "Тип не определён"]

  # — индексы / границы / прочий рантайм с явным исключением —
  - code: M.RUNTIME
    axis: M
    label: "сбой при выполнении"
    match: ["Index", "Индекс", "за границами", "out of", "Деление на 0", "ИСКЛЮЧЕНИЕ",
            "Error in line", "Ошибка при вызове"]

# Корзины по умолчанию (ничего не совпало) — держим видимыми.
# blame — ЧЬЯ это поломка: model (модель написала плохой код) | task (условие или тесты
# задачи) | harness (наш скорер/обвязка) | infra (окружение: сеть, песочница, зависание).
# Без неё сбой окружения выглядел дефектом модели, а инфраструктурные прогоны вовсе
# выпадали из воронки, занижая знаменатель.
defaults:
  parse:   { code: S.PARSE, axis: S, label: "ошибка синтаксиса", blame: model }     # умер на разборе
  run:     { code: M.RUNTIME, axis: M, label: "сбой при выполнении", blame: model } # умер на запуске
  noentry: { code: M.NOENTRY, axis: M, label: "нужной функции нет", blame: model }  # точка входа не найдена
  wrong: { code: M.WRONG, axis: M, label: "результат не тот", blame: model }   # дожил, но тесты не прошли
  meta:  { code: P.METADATA, axis: P, label: "нет такого поля или объекта", blame: model } # платформенная (по структуре)
  # — окружение: вина НЕ модели —
  timeout:    { code: INFRA.TIMEOUT, axis: null, label: "окружение зависло — не измерено", blame: infra }
  no_result:  { code: INFRA.NO_RESULT, axis: null, label: "прогон не дал результата", blame: infra }
  sandbox:    { code: INFRA.SANDBOX, axis: null, label: "песочница не поднялась", blame: infra }
  generation: { code: INFRA.GENERATION, axis: null, label: "модель не ответила (сеть/доступ)", blame: infra }

# Подклассы ошибок, прилетающих под общим маркером «Ошибка при вызове метода контекста
# (Выполнить)». Сам маркер не говорит, ЧТО сломалось: под ним и обращение к несуществующему
# полю (это ось P), и синтаксис текста запроса (а это, по конституции, ось M — excludes S).
# Пока используется аудитом корпуса (prism audit) для отчёта; на баллы не влияет.
# Порядок важен: частное выше общего.
platform_subclasses:
  # — обращения к метаданным: ось P —
  - code: P.FIELD
    axis: P
    label: "нет такого поля"
    match: ["Поле не найдено", "Поле объекта не обнаружено"]
  - code: P.TABLE
    axis: P
    label: "нет такой таблицы"
    match: ["Таблица не найдена"]
  - code: P.VT_PARAMS
    axis: P
    label: "неверные параметры виртуальной таблицы"
    match: ['Неверные параметры "Регистр']
  - code: P.METHOD
    axis: P
    label: "нет такого метода у объекта"
    match: ["Метод объекта не обнаружен"]
  - code: P.OBJECT
    axis: P
    label: "нет такого объекта"
    match: ["Объект не найден"]

  # — авторство текста запроса: ось M (запрос компилируется платформой, не модулем) —
  #
  # metadata_reached (по умолчанию true) — ДОШЁЛ ли разбор запроса до проверки имён.
  # Различие нужно оси P. Платформа компилирует текст запроса по шагам: сначала грамматика,
  # потом разрешение имён таблиц и полей. Если запрос не разобрался грамматически, до имён
  # дело не дошло, и про знание метаданных мы не узнали НИЧЕГО. Считать такой тест «чистым»
  # значит поставить P=10 за непроверенное: на корпусе это ровно 6 записей, прыгающих с 0 на 10.
  # Поэтому такие тесты выбрасываются из знаменателя доли, а не попадают в числитель;
  # не осталось ни одного проверенного теста → ось не измерена.
  # Ошибки, случившиеся ПОСЛЕ разрешения имён (незаданный параметр, недопустимый тип),
  # метаданные подтверждают — у них metadata_reached остаётся true.
  - code: M.QUERY_NESTED
    axis: M
    metadata_reached: false   # грамматика не прошла — до имён не дошли
    label: "вложенный запрос не допускается"
    match: ["Не допускается использование вложенных запросов"]
  - code: M.QUERY_GROUPBY
    axis: M
    metadata_reached: false   # грамматика не прошла — до имён не дошли
    label: "неверная группировка"
    match: ["Предложения СГРУППИРОВАТЬ"]
  - code: M.QUERY_AMBIGUOUS
    axis: M
    label: "неоднозначное поле в запросе"
    match: ["Неоднозначное поле"]
  - code: M.QUERY_PARAM_UNSET
    axis: M
    label: "параметр запроса не установлен"
    match: ["Не задано значение параметра"]
  - code: M.QUERY_TYPE
    axis: M
    label: "недопустимый тип в запросе"
    match: ["Тип не может быть выбран в запросе", "Содержимое объекта данных может быть"]
  - code: M.QUERY_SYNTAX
    axis: M
    metadata_reached: false   # грамматика не прошла — до имён не дошли
    label: "синтаксис текста запроса"
    match: ["Синтаксическая ошибка", "Ожидается выражение", "Ожидается ключевое слово",
            "Неверные параметры"]
