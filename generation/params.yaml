    sonnet5:     { temperature: 0.1, runs: 1 }      # Claude Sonnet 5 через AITUNNEL
    gpt56_terra: { temperature: 0.1, runs: 1 }      # GPT-5.6 Terra через AITUNNEL (reasoning)
