id: B23
name: Лучшие покупатели за период (обороты, сортировка, ограничение числа строк)
category: B
difficulty: medium

entry_point_patterns: ["\\w*Топ\\w*", "\\w*Лучш\\w*", "\\w*Покупател\\w*"]

prompt: |
  Написать функцию, возвращающую покупателей с наибольшей суммой продаж за период.
  Параметры: дата начала, дата окончания (обе границы включаются), количество покупателей.
  Вернуть таблицу значений с колонками Контрагент, Сумма: не более заданного количества строк,
  по убыванию суммы продаж. Продажи одного покупателя по разным товарам складываются.

expected_objects:
  - РегистрНакопления.Продажи
  - Справочник.Контрагенты

tags:
  skill: [запрос, метаданные, коллекции]
  platform: [виртуальная-таблица, регистр-накопления]
