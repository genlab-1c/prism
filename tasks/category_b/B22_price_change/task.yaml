id: B22
name: Изменение цены за период (два среза последних)
category: B
difficulty: medium

entry_point_patterns: ["\\w*Изменени\\w*Цен\\w*", "\\w*Разниц\\w*Цен\\w*", "\\w*Цен\\w*Период\\w*"]

prompt: |
  Написать функцию, возвращающую изменение цены продажи номенклатуры за период:
  цена, действующая на дату окончания, минус цена, действующая на дату начала.
  Цены хранятся в периодическом регистре сведений с историей изменений.
  Если на дату цена ещё не установлена, считать её равной 0.
  Параметры: номенклатура, дата начала, дата окончания.
  Вернуть число.

expected_objects:
  - РегистрСведений.ЦеныПродажи
  - Справочник.Номенклатура

tags:
  skill: [запрос, метаданные, числа]
  platform: [срез-последних, регистр-сведений]
