id: B25
name: Дефицит материалов по спецификации (табличная часть справочника и остатки)
category: B
difficulty: hard

entry_point_patterns: ["\\w*Дефицит\\w*", "\\w*Нехватк\\w*", "\\w*Потребност\\w*"]

prompt: |
  Написать функцию расчёта дефицита материалов для выпуска изделий по спецификации.
  Спецификация — элемент справочника с табличной частью материалов: материал и норма расхода
  на одно изделие. Один материал может встречаться в нескольких строках — нормы складываются.
  Потребность = норма × количество изделий.
  Дефицит = потребность минус текущий остаток материала на складе.
  Параметры: спецификация, количество изделий.
  Вернуть таблицу значений с колонками Материал, Дефицит — только материалы, у которых дефицит больше нуля.

expected_objects:
  - Справочник.Спецификации
  - РегистрНакопления.ТоварыНаСкладах
  - Справочник.Номенклатура

tags:
  skill: [запрос, метаданные, числа]
  platform: [табличная-часть, виртуальная-таблица, регистр-накопления]
