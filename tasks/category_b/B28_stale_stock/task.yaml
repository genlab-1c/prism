id: B28
name: Залежалые товары (остаток есть, расхода за интервал не было)
category: B
difficulty: hard

entry_point_patterns: ["\\w*Залежал\\w*", "\\w*Неликвид\\w*", "\\w*БезДвижен\\w*", "\\w*БезРасход\\w*"]

prompt: |
  Написать функцию поиска залежалых товаров.
  Товар считается залежалым, если его остаток на дату анализа больше нуля и за указанное
  число дней до даты анализа по нему не было расхода (движений регистра с видом «Расход»).
  Интервал проверки — от (дата анализа минус количество дней) включительно до даты анализа,
  не включая её.
  Параметры: дата анализа, количество дней.
  Вернуть массив ссылок на номенклатуру.

expected_objects:
  - РегистрНакопления.ТоварыНаСкладах
  - Справочник.Номенклатура

tags:
  skill: [запрос, метаданные, даты]
  platform: [виртуальная-таблица, регистр-накопления, документ-движения]
