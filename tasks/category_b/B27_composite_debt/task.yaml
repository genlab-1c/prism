id: B27
name: Долги контрагентов в регистре с составным типом должника
category: B
difficulty: hard

entry_point_patterns: ["\\w*Долг\\w*Контрагент\\w*", "\\w*Должник\\w*", "\\w*Долг\\w*"]

prompt: |
  Написать функцию, возвращающую текущие долги контрагентов.
  В регистре взаиморасчётов должником может быть контрагент или сотрудник
  (измерение составного типа). Нужны только контрагенты; сотрудники в результат не входят.
  Параметров нет.
  Вернуть таблицу значений с колонками Должник, Сумма — контрагенты с положительным
  текущим долгом, по убыванию суммы.

expected_objects:
  - РегистрНакопления.Взаиморасчеты
  - Справочник.Контрагенты
  - Справочник.Сотрудники

tags:
  skill: [запрос, метаданные, коллекции]
  platform: [виртуальная-таблица, регистр-накопления]
