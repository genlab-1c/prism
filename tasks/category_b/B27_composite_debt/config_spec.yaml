# Синтетическая конфигурация B27: измерение регистра составного типа (контрагент или сотрудник).
catalogs:
  Контрагенты:
    hierarchical: false
  Сотрудники:
    hierarchical: false

documents:
  КорректировкаДолга:
    registers: [Взаиморасчеты]

accumulation_registers:
