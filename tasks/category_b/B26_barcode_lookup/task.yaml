id: B26
name: Поиск номенклатуры по штрихкоду (непериодический регистр сведений)
category: B
difficulty: easy

entry_point_patterns: ["\\w*Штрихкод\\w*", "Найти\\w*Номенклатур\\w*", "\\w*Номенклатур\\w*По\\w*"]

prompt: |
  Написать функцию поиска номенклатуры по штрихкоду.
  Штрихкоды хранятся в непериодическом регистре сведений.
  Параметр: штрихкод (строка; может прийти с пробелами по краям — их нужно отбросить).
  Вернуть ссылку на номенклатуру; если штрихкод не найден или пуст — вернуть Неопределено.

expected_objects:
  - РегистрСведений.Штрихкоды
  - Справочник.Номенклатура

tags:
  skill: [запрос, метаданные, строки]
  platform: [регистр-сведений]
