# Синтетическая конфигурация B24: иерархическая номенклатура и остатки по складам.
catalogs:
  Номенклатура:
    hierarchical: true
  Склады:
    hierarchical: false

documents:
  ДвижениеТоваров:
    registers: [ТоварыНаСкладах]

accumulation_registers:
  ТоварыНаСкладах:
    register_type: Balance
