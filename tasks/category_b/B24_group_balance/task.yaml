id: B24
name: Остаток по группе номенклатуры (остатки и иерархия)
category: B
difficulty: medium

entry_point_patterns: ["\\w*Остат\\w*Групп\\w*", "\\w*Групп\\w*", "\\w*Остат\\w*"]

prompt: |
  Написать функцию, возвращающую суммарный остаток товаров группы номенклатуры на складе на дату.
  В группу входят товары самой группы и всех вложенных в неё групп.
  Параметры: группа номенклатуры, склад, дата.
  Вернуть число; если остатков нет — вернуть 0.

expected_objects:
  - РегистрНакопления.ТоварыНаСкладах
  - Справочник.Номенклатура
  - Справочник.Склады

tags:
  skill: [запрос, метаданные]
  platform: [виртуальная-таблица, регистр-накопления, иерархия]
