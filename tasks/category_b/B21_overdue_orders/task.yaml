id: B21
name: Сумма просроченных заказов (перечисление и дата)
category: B
difficulty: medium

entry_point_patterns: ["\\w*Просроч\\w*", "\\w*Заказ\\w*"]

prompt: |
  Написать функцию, возвращающую сумму просроченных заказов контрагента.
  Заказы хранятся в справочнике; у заказа есть контрагент, статус, дата отгрузки и сумма.
  Просроченным считается заказ в статусе «Новый» или «В работе», дата отгрузки которого
  раньше заданной даты контроля (заказ с отгрузкой в день контроля просроченным не считается).
  Параметры: контрагент, дата контроля.
  Вернуть число; если просроченных заказов нет — вернуть 0.

expected_objects:
  - Справочник.Заказы
  - Справочник.Контрагенты
  - Перечисление.СтатусыЗаказов

tags:
  skill: [запрос, метаданные, даты]
  platform: []
