# Синтетическая конфигурация B21: заказы — справочник со статусом-перечислением и датой отгрузки.
enums:
  СтатусыЗаказов: [Новый, ВРаботе, Отгружен, Отменен]

catalogs:
  Контрагенты:
    hierarchical: false
  Заказы:
    hierarchical: false
    attributes:
      Контрагент: { type: СправочникСсылка.Контрагенты }
      Статус: { type: ПеречислениеСсылка.СтатусыЗаказов }
      ДатаОтгрузки: { type: Дата }
      Сумма: { type: Число, length: 15, precision: 2 }
