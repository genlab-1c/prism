id: B29
name: План-фактный анализ продаж (полное соединение двух оборотных регистров)
category: B
difficulty: medium

entry_point_patterns: ["\\w*ПланФакт\\w*", "\\w*План\\w*Факт\\w*", "\\w*Отклонен\\w*"]

prompt: |
  Написать функцию план-фактного анализа продаж за период.
  План продаж и фактические продажи хранятся в двух оборотных регистрах накопления.
  Параметры: дата начала, дата окончания (обе границы включаются).
  Вернуть таблицу значений с колонками Номенклатура, План, Факт, Отклонение
  (отклонение = факт минус план). В результат входят все товары, у которых за период
  есть план или факт; отсутствующее значение считать нулём.

expected_objects:
  - РегистрНакопления.ПланПродаж
  - РегистрНакопления.Продажи
  - Справочник.Номенклатура

tags:
  skill: [запрос, метаданные, числа]
  platform: [виртуальная-таблица, регистр-накопления]
