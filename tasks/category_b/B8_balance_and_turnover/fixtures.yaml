# Фикстуры B8 — данные, которые харнесс создаёт в базе перед тестом.
#
# Данные покрывают ВСЁ, что требует условие, а не только приход по одному складу:
#   движение ДО начала периода          → начальный остаток;
#   движения ВНУТРИ периода             → приход;
#   расходное движение внутри периода   → расход (колонка была всегда нулевой,
#                                          и её можно было захардкодить нулём);
#   второй склад                        → проверка необязательного параметра «склад»;
#   товар без движений до периода       → начальный остаток 0 (ЕСТЬNULL).
#
# Движение 28.02 щупает границу КонецПериода: попадает в приход ТОЛЬКО если кандидат
# берёт конец дня, а не Дата(...) = 00:00:00.
#
# Даты движений заданы ЯВНО и в прошлом — см. harness/execute/onec/fixtures_gen.py:
# без периода движение попадало бы на момент прогона, а срез остатков его не видит.

catalogs:
  Склады:
    - {ref: Основной, Наименование: "Основной склад"}
    - {ref: Резервный, Наименование: "Резервный склад"}
  Номенклатура:
    - {ref: Товар1, Наименование: "Товар 1"}
    - {ref: Товар2, Наименование: "Товар 2"}

register_records:
  ДвиженияТоваров:
    registrar: ВводТоваров
    records:
      # Товар1 на Основном складе: есть начальный остаток, приход и расход
      - {Период: 2026-01-10, Склад: Основной, Номенклатура: Товар1, Количество: 10}   # до периода → нач.остаток
      - {Период: 2026-02-05, Склад: Основной, Номенклатура: Товар1, Количество: 4}    # в периоде → приход
      - {Период: 2026-02-28, Склад: Основной, Номенклатура: Товар1, Количество: 6}    # граница периода → приход (только с КонецДня)
      - {Период: 2026-02-15, Склад: Основной, Номенклатура: Товар1, Количество: 3, ВидДвижения: Расход}
      # Товар1 на Резервном складе: виден только при вызове БЕЗ склада
      - {Период: 2026-01-20, Склад: Резервный, Номенклатура: Товар1, Количество: 5}   # до периода → нач.остаток
      # Товар2: начального остатка НЕТ, только приход в периоде
      - {Период: 2026-02-10, Склад: Основной, Номенклатура: Товар2, Количество: 7}

# Ожидания за период Дата(2026,2,1)..КонецДня(Дата(2026,2,28)) — справочно
# (проверки заданы в tests.bsl).
expected:
  товар1_основной:               # вызов со складом «Основной»
    НачальныйОстаток: 10
    Приход: 10                   # 4 + 6
    Расход: 3
    КонечныйОстаток: 17          # 10 + 10 − 3
  товар2_основной:               # товар без начального остатка
    НачальныйОстаток: 0
    Приход: 7
    Расход: 0
    КонечныйОстаток: 7
  товар1_без_склада:             # вызов БЕЗ склада — оба склада вместе
    КонечныйОстаток: 22          # 17 (Основной) + 5 (Резервный)
